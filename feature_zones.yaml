# Each zone is a rectangle defined by opposite corners p1 and p2.
# Coordinates use the 1280x720 frame. Edit these values manually.
# Cameras 1/2: LEFT and RIGHT. Camera 3: DEFAULT.
cameras:
  '1':
    LEFT:
      p1: [150, 200]
      p2: [560, 300]
    RIGHT:
      p1: [830, 200]
      p2: [1200, 300]
  '2':
    LEFT:
      p1: [40, 220]
      p2: [480, 420]
    RIGHT:
      p1: [332, 79]
      p2: [497, 246]
  '3':
    DEFAULT:
      p1: [429, 311]
      p2: [906, 502]
