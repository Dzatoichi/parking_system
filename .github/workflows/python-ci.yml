name: Python controller checks

on:
  push:
    branches: [feature-candidate-search-v1, reid_and_tracking]
  pull_request:
    branches: [reid_and_tracking, feature-candidate-search-v1]
  workflow_dispatch:

jobs:
  syntax-and-runtime-reid-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pip numpy opencv-python-headless pyyaml pytest
      - name: Compile runtime and matching modules
        run: >-
          python -m py_compile
          run_main_controller.py
          RuntimeReID.py
          DB/parking_repository.py
          FeatureZoneModule/EntrySessionManager.py
          FeatureZoneModule/FeatureZoneManager.py
          TrackletModule/CandidateSearch.py
          TrackletModule/Matcher.py
          TriggerModule/TriggerProcess.py
          PlateOCRModule.py
          Config.py
      - name: Run full test suite
        run: python -m pytest -q tests
